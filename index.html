<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop Timer 5:1</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icona.png">

    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --yellow: #ffee00;
            --pink: #ff00ff;
            --blue: #00d4ff;
            --green: #2ecc71;
            --black: #2d3436;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--pink);
            font-family: 'Fredoka One', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .main-card {
            background: var(--yellow);
            border: 6px solid var(--black);
            box-shadow: 12px 12px 0px var(--black);
            border-radius: 35px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        #statusText {
            font-size: 2rem;
            color: var(--black);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .display {
            font-family: 'Bungee', cursive;
            font-size: 4.5rem;
            color: var(--black);
            background: var(--white);
            border: 6px solid var(--black);
            border-radius: 25px;
            margin: 25px 0;
            padding: 20px 10px;
        }

        button {
            font-family: 'Bungee', cursive;
            font-size: 1.6rem;
            padding: 20px;
            border: 5px solid var(--black);
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 8px 8px 0px var(--black);
        }

        .btn-study { background: var(--blue); color: var(--white); }
        .btn-stop { background: #ff3e3e; color: var(--white); }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--black);
        }
    </style>
</head>
<body>

    <div class="main-card" id="card">
        <div id="statusText">DAJE!</div>
        <div id="timerDisplay" class="display">00:00</div>
        <button id="mainBtn" class="btn-study" onclick="handleTimer()">STUDIA!</button>
    </div>

<script>
    let seconds = 0;
    let timerInterval = null;
    let mode = 'READY'; 

    const display = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');
    const btn = document.getElementById('mainBtn');
    const card = document.getElementById('card');

    function updateDisplay(s) {
        const mins = Math.floor(s / 60).toString().padStart(2, '0');
        const secs = (s % 60).toString().padStart(2, '0');
        display.innerText = `${mins}:${secs}`;
    }

    function handleTimer() {
        if (mode === 'READY' || mode === 'BREAK_FINISHED') {
            startStudying();
        } else if (mode === 'STUDYING') {
            stopStudyingAndStartBreak();
        }
    }

    function startStudying() {
        mode = 'STUDYING';
        seconds = 0;
        statusText.innerText = "🔥 FOCUS! 🔥";
        btn.innerText = "STOP!";
        btn.className = "btn-stop";
        card.style.backgroundColor = "#ffee00"; // Giallo diretto
        
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            updateDisplay(seconds);
        }, 1000);
    }

    function stopStudyingAndStartBreak() {
        clearInterval(timerInterval);
        mode = 'BREAK';
        
        let breakSeconds = Math.floor(seconds / 5);
        if(breakSeconds < 1) breakSeconds = 1; 

        statusText.innerText = "🍦 RELAX... 🍦";
        btn.style.display = 'none'; 
        card.style.backgroundColor = "#2ecc71"; // Verde diretto
        
        updateDisplay(breakSeconds);

        timerInterval = setInterval(() => {
            breakSeconds--;
            updateDisplay(breakSeconds);
            if (breakSeconds <= 0) {
                clearInterval(timerInterval);
                finishBreak();
            }
        }, 1000);
    }

    function finishBreak() {
        mode = 'BREAK_FINISHED';
        statusText.innerText = "ANCORA?";
        btn.innerText = "RIPARTI!";
        btn.className = "btn-study";
        btn.style.display = 'block';
        card.style.backgroundColor = "#ffee00";
        updateDisplay(0);
    }
</script>
</body>
</html>
